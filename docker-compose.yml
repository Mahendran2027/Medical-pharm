version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medifind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2025}
      POSTGRES_DB: ${POSTGRES_DB:-MedicineAvailabilityDb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-MedicineAvailabilityDb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medifind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medifind-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-MedicineAvailabilityDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_secure_pass_2025}
      - Jwt__Key=${JWT_SECRET_KEY:-SuperSecretKeyForPharmacySystem2025SecureKeyNeverExposeInProduction!}
      - Jwt__Issuer=${JWT_ISSUER:-MedicineAvailabilityApi}
      - Jwt__Audience=${JWT_AUDIENCE:-MedicineAvailabilityApp}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-SuperSecretKeyForPharmacySystem2025SecureKeyNeverExposeInProduction!}
      - JwtSettings__Issuer=${JWT_ISSUER:-MedicineAvailabilityApi}
      - JwtSettings__Audience=${JWT_AUDIENCE:-MedicineAvailabilityApp}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - medifind-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medifind-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - medifind-network

volumes:
  postgres_data:
    driver: local

networks:
  medifind-network:
    driver: bridge
